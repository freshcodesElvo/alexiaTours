        /* PRELOADER */
#preloader {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: #fff;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 15px;
  z-index: 9999;
  transition: opacity 0.5s ease;
}

/* Lottie container (optional control) */
#preloader dotlottie-wc {
  width: 140px;
  height: 140px;
}

/* Text */
.loader-text {
  color: #FFD700;
  font-size: 14px;
  letter-spacing: 1px;
  font-family: Arial, sans-serif;
  animation: fadePulse 1.5s infinite;
}

/* Smooth pulsing text */
@keyframes fadePulse {
  0%, 100% { opacity: 0.4; }
  50% { opacity: 1; }
}

    <section class="book-tour-section py-5">
        <div class="container">
            <div class="row text-center mb-5">
                <div class="col-lg-8 mx-auto">
                    <h1 class="page-heading fw-bold">Complete Your Booking</h1>
                    <p class="lead text-muted">Just a few more steps to secure your unforgettable adventure.</p>
                </div>
            </div>

            <div class="row g-5">
                <div class="col-lg-8">
                    <h2 class="fw-bold mb-4">Your Details</h2>
                    <form action="#" method="post" class="needs-validation" novalidate>
                        <div class="row g-4 mb-4">
                            <div class="col-md-6">
                                <label for="bookingFullName" class="form-label fw-bold">Full Name</label>
                                <input style="color: #000;" type="text" class="form-control rounded-pill" id="bookingFullName" placeholder="Enter your full name" required>
                            </div>
                            <div class="col-md-6">
                                <label for="bookingEmail" class="form-label fw-bold">Email Address</label>
                                <input style="color: #000;" type="email" class="form-control rounded-pill" id="bookingEmail" placeholder="Enter your email" required>
                            </div>
                            <div class="col-md-6">
                                <label for="bookingPhone" class="form-label fw-bold">Phone Number</label>
                                <input style="color: #000;" type="tel" class="form-control rounded-pill" id="bookingPhone" placeholder="Enter your phone number" required>
                            </div>
                            <div class="col-md-6">
                                <label for="bookingNationality" class="form-label fw-bold">Nationality</label>
                                <input style="color: #000;" type="text" class="form-control rounded-pill" id="bookingNationality" placeholder="Your nationality" required>
                            </div>
                        </div>

                        <h2 class="fw-bold my-4">Traveler Information</h2>
                        <div class="row g-4 mb-4">
                            <div class="col-md-6">
                                <label for="numAdults" class="form-label fw-bold">Adults (12+)</label>
                                <input style="color: #000;" type="number" class="form-control rounded-pill" id="numAdults" value="1" min="1" required>
                            </div>
                            <div class="col-md-6">
                                <label for="numChildren" class="form-label fw-bold">Children (0-11)</label>
                                <input style="color: #000;" type="number" class="form-control rounded-pill" id="numChildren" value="0" min="0">
                            </div>
                            <div class="col-md-6">
                                <label for="preferredDates" class="form-label fw-bold">Preferred Start Date</label>
                                <input style="color: #000;" type="date" class="form-control rounded-pill" id="preferredDates" required>
                            </div>
                            <div class="col-md-6">
                                <label for="tourOfInterest" class="form-label fw-bold">Tour of Interest</label>
                                <select class="form-select rounded-pill" id="tourOfInterest" required>
                                    <option selected disabled value="">Choose...</option>
                                    <option>Maasai Mara Safari</option>
                                    <option>Diani Beach Getaway</option>
                                    <option>Nairobi City & Culture</option>
                                    <option>Amboseli Elephant Trek</option>
                                </select>
                            </div>
                        </div>

                        <h2 class="fw-bold my-4">Special Requests</h2>
                        <div class="mb-4">
                            <label for="specialRequests" class="form-label fw-bold">Any special requests or notes?</label>
                            <textarea class="form-control rounded-4" id="specialRequests" rows="4" placeholder="Dietary restrictions, accessibility needs, etc."></textarea>
                        </div>

                        <div class="form-check mb-4">
                            <input class="form-check-input" type="checkbox" value="" id="termsCheck" required>
                            <label class="form-check-label" for="termsCheck">
                                I agree to the <a href="terms.html" class="text-decoration-none text-warning fw-bold">Terms & Conditions</a> and <a href="privacy.html" class="text-decoration-none text-warning fw-bold">Privacy Policy</a>.
                            </label>
                        </div>
                        
                        <div class="d-grid gap-2">
                            <button class="btn btn-warning btn-lg fw-bold text-uppercase" type="submit">Confirm Booking</button>
                        </div>
                    </form>
                </div>

                <div class="col-lg-4">
                    <div class="booking-summary-card p-4 rounded-4 shadow">
                        <h4 class="fw-bold mb-3">Your Booking Summary</h4>
                        <ul class="list-unstyled mb-4">
                            <li class="d-flex justify-content-between mb-2">
                                <span>Tour Name:</span>
                                <span class="fw-bold" id="sumTourName">Select a Tour</span>
                            </li>
                            <li class="d-flex justify-content-between mb-2">
                                <span>Travelers:</span>
                                <span class="fw-bold" id="sumTravelers">1 Adult, 0 Children</span>
                            </li>
                            <li class="d-flex justify-content-between mb-2">
                                <span>Start Date:</span>
                                <span class="fw-bold" id="sumStartDate">Not selected</span>
                            </li>
                        </ul>
                        <hr>
                        <div class="d-flex justify-content-between align-items-center mt-4">
                            <span class="fw-bold fs-5">Total Estimated Cost:</span>
                            <span class="fw-bold fs-4 text-warning" id="sumTotal">USD 0</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <div id="footer-placeholder"></div>
    <script>
        fetch('footer.html')
          .then(response => response.text())
          .then(data => {

    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.min.js"></script>

    <div class="cursor-circle"></div>
    <script>
        const cursor = document.querySelector(".cursor-circle");
        let mouseX = 0, mouseY = 0;
        let currentX = 0, currentY = 0;

        document.addEventListener("mousemove", (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
        });

        function animate() {
            currentX += (mouseX - currentX) * 0.15;
            currentY += (mouseY - currentY) * 0.15;
            cursor.style.left = currentX + "px";
            cursor.style.top = currentY + "px";
            requestAnimationFrame(animate);
        }
        animate();
    </script>

    <script src="userjs/booking.js"></script>
    <script src="userjs/loader.js"></script>
</body>
