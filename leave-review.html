<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leave a Review | Alexia Tours</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-6">
                <div class="text-center mb-4">
                    <img src="pictures/Logo.jpeg" alt="Logo" style="height: 80px;" class="mb-3 rounded-circle">
                    <h2 id="welcome-msg" class="fw-bold">Welcome Back!</h2>
                    <p class="text-muted">We'd love to hear about your recent journey.</p>
                </div>

                <div class="card shadow-sm border-0 rounded-4 p-4">
                    <form id="verifiedReviewForm">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Rating</label>
                            <select id="rating" class="form-select border-0 bg-light p-3" required>
                                <option value="5">⭐⭐⭐⭐⭐ - Exceptional</option>
                                <option value="4">⭐⭐⭐⭐ - Great</option>
                                <option value="3">⭐⭐⭐ - Good</option>
                                <option value="2">⭐⭐ - Average</option>
                                <option value="1">⭐ - Poor</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Your Experience</label>
                            <textarea id="reviewText" class="form-control border-0 bg-light p-3" rows="5" placeholder="Tell us about the highlights of your trip..." required></textarea>
                        </div>

                        <button type="submit" class="btn btn-warning w-100 fw-bold py-3 rounded-3">Submit Review</button>
                    </form>
                    <div id="statusMessage" class="mt-3 text-center"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="userjs/leave-review.js"></script>
</body>
</html>
