<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Journal Entry | Alexia Tours</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet"/>
  <link rel="stylesheet" href="assets/css/style.css">
  <style>
    .article-hero {
      height: 50vh;
      min-height: 380px;
      background-size: cover;
      background-position: center;
      position: relative;
      display: flex;
      align-items: flex-end;
    }
    .article-hero::before {
      content: "";
      position: absolute;
      top:0; left:0; width:100%; height:100%;
      background: linear-gradient(rgba(0,0,0,0.1), rgba(0,0,0,0.8));
      z-index: 1;
    }
    .article-hero-content {
      position: relative;
      z-index: 2;
      color: #fff;
      padding-bottom: 40px;
    }
    .blog-badge {
      background-color: #F99E1C;
      color: #fff;
      padding: 5px 12px;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border-radius: 5px;
    }
    .article-body-wrapper p {
      font-size: 1.1rem;
      line-height: 1.8;
      color: rgb(27, 27, 27);
      margin-bottom: 1.8rem;
    }
  </style>
</head>
<body style="background-color: #ffffff; padding-top: 80px;">

  <div id="navbar-placeholder"></div>

  <section id="article-hero-bg" class="article-hero">
    <div class="container article-hero-content">
      <span id="article-category" class="blog-badge mb-3 d-inline-block">Category</span>
      <h1 id="article-title" class="display-4 fw-bold text-white mb-2">Loading Entry Title...</h1>
      <p class="mb-0 text-white-50"><i class="ri-calendar-line me-1"></i> <span id="article-date">-- --, ----</span></p>
    </div>
  </section>

  <main class="container py-5 my-3">
    <div class="row justify-content-center">
      <div class="col-lg-8">
        
        <div class="p-4 mb-5 bg-light border-start border-4" style="border-color: #F99E1C !important; border-radius: 5px;">
          <p id="article-summary" class="lead mb-0 text-secondary fw-semibold" style="font-size: 1.15rem; line-height: 1.6;"></p>
        </div>

        <article id="article-content" class="article-body-wrapper">
          <p class="text-muted">Fetching editorial body content from basecamp database registers...</p>
        </article>

        <hr class="my-5 opacity-25">
        <a href="blog.html" class="btn btn-outline-dark px-4 py-2" style="border-radius: 5px; font-weight: 600;">
          <i class="ri-arrow-left-line me-2"></i> Back to Journal Feed
        </a>

      </div>
    </div>
  </main>

  <div id="footer-placeholder"></div>

  <script>
    fetch('navbar.html').then(r => r.text()).then(d => { document.getElementById('navbar-placeholder').innerHTML = d; });
    fetch('footer.html').then(r => r.text()).then(d => { document.getElementById('footer-placeholder').innerHTML = d; });
  </script>

  <script src="userjs/config.js"></script>
  <script>
    async function loadArticleDetail() {
        const params = new URLSearchParams(window.location.search);
        const slug = params.get('slug');

        if(!slug) {
            window.location.href = 'blog.html';
            return;
        }

        // Uses configuration parameters built in config.js (BASE_URL context mapping)
        const API_SINGLE_BLOG = `${BASE_URL}/api/blogs/${slug}`;

        try {
            const res = await fetch(API_SINGLE_BLOG);
            if(!res.ok) throw new Error("Article content profile matching empty mapping registry.");
            const article = await res.json();

            // Meta tags and Text Binding Node Handlers
            document.title = `${article.title} | Alexia Tours Journal`;
            document.getElementById('article-title').innerText = article.title;
            document.getElementById('article-category').innerText = article.category;
            document.getElementById('article-summary').innerText = article.summary;

            document.getElementById('article-date').innerText = new Date(article.created_at).toLocaleDateString('en-US', {
                month: 'long', day: 'numeric', year: 'numeric'
            });

            // Parse Paragraph layout markers split lines cleanly
            if(article.content) {
                document.getElementById('article-content').innerHTML = article.content
                    .split('\n')
                    .filter(para => para.trim() !== "")
                    .map(para => `<p>${para.trim()}</p>`)
                    .join('');
            }

            // Image Handler allocation mapping validation configuration
            if(article.image_path) {
                document.getElementById('article-hero-bg').style.backgroundImage = `url('${BASE_URL}/${article.image_path}')`;
            } else {
                document.getElementById('article-hero-bg').style.backgroundImage = `url('assets/img/blog-placeholder.jpg')`;
            }

        } catch (err) {
            console.error("Article Setup Error Context mapping logs:", err);
            document.getElementById('article-content').innerHTML = `
                <div class="text-center py-5">
                    <i class="ri-alert-line display-3 text-danger mb-3"></i>
                    <h3 class="fw-bold">Unable to locate requested page profile</h3>
                    <p class="text-muted">The post link parameters may have changed or been archived.</p>
                </div>`;
        }
    }
    document.addEventListener("DOMContentLoaded", loadArticleDetail);
  </script>
</body>
</html>
