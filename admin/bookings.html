<!DOCTYPE html>
<html lang="en">
<head>
    <script src="auth-guard.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Bookings</title>

    <link rel="stylesheet" href="./css/admin.css">
    <link rel="stylesheet" href="../assets/css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>

    <style>
        :root {
            --sidebar-width: 260px;
        }
           #sidebar {
            position: fixed;
            top: 0;
            left: 0;
            height: 100vh;
            width: var(--sidebar-width);
            z-index: 1040;
            transition: transform 0.3s ease;
            overflow-y: auto;
        }
         #sidebar.hidden {
            transform: translateX(-100%);
        }

        /* Sidebar overlay for mobile */
        #sidebar-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.45);
            z-index: 1030;
        }

        #sidebar-overlay.active {
            display: block;
        }

        

        /* ── Main Content ── */
        .main-content {
            margin-left: var(--sidebar-width);
            padding: 40px;
            transition: margin-left 0.3s ease;
            min-height: 100vh;
        }

        .main-content.expanded {
            margin-left: 0;
        }

        /* ── Search bar ── */
        .search-container {
            width: 100%;
            max-width: 380px;
        }

        /* ── Table: hide less-critical columns on small screens ── */
        @media (max-width: 767.98px) {
            /* Hide Email and Date columns on mobile */
            .bookings-table th:nth-child(3),
            .bookings-table td:nth-child(3),
            .bookings-table th:nth-child(5),
            .bookings-table td:nth-child(5) {
                display: none;
            }
        }

        @media (max-width: 575.98px) {
            /* Also hide ID on extra-small */
            .bookings-table th:nth-child(1),
            .bookings-table td:nth-child(1) {
                display: none;
            }
        }

        /* ── Responsive breakpoints ── */
        @media (max-width: 991.98px) {
            #sidebar {
                transform: translateX(-100%);
            }

            #sidebar.visible {
                transform: translateX(0);
            }

            .main-content {
                margin-left: 0 !important;
                padding: 20px 16px;
            }
        }

        @media (max-width: 575.98px) {
            .main-content {
                padding: 16px 12px;
            }

            h1 {
                font-size: 1.25rem;
            }

            /* Stack header vertically on xs */
            .content-header {
                flex-direction: column;
                align-items: flex-start !important;
                gap: 12px;
            }

            .search-container {
                max-width: 100%;
            }
        }
    </style>
</head>

<body>

    <!-- Mobile sidebar overlay -->
    <div id="sidebar-overlay"></div>

    <div id="nav-placeholder"></div>
    <script>
        fetch('nav.html')
            .then(r => r.text())
            .then(data => {
                document.getElementById('nav-placeholder').innerHTML = data;
            });
    </script>

    <div id="navbar-placeholder"></div>
    <script>
        fetch('adminNavbar.html')
            .then(r => r.text())
            .then(data => {
                document.getElementById('navbar-placeholder').innerHTML = data;

                // Logout → modal
                const logoutBtn = document.getElementById('logoutBtn');
                if (logoutBtn) {
                    logoutBtn.addEventListener('click', () => {
                        new bootstrap.Modal(document.getElementById('logoutModal')).show();
                    });
                }

                // Sidebar toggle (responsive)
                const toggleBtn   = document.getElementById('menuToggle');
                const sidebar     = document.getElementById('sidebar');
                const mainContent = document.querySelector('.main-content');
                const overlay     = document.getElementById('sidebar-overlay');

                if (toggleBtn) {
                    toggleBtn.addEventListener('click', () => {
                        if (window.innerWidth < 992) {
                            sidebar.classList.toggle('visible');
                            overlay.classList.toggle('active');
                        } else {
                            sidebar.classList.toggle('hidden');
                            mainContent.classList.toggle('expanded');
                        }
                    });

                    overlay.addEventListener('click', () => {
                        sidebar.classList.remove('visible');
                        overlay.classList.remove('active');
                    });
                }

                // Actual logout
                const confirmBtn = document.getElementById('confirmLogoutBtn');
                if (confirmBtn) {
                    confirmBtn.addEventListener('click', () => {
                        localStorage.removeItem('adminToken');
                        window.location.href = 'login.html';
                    });
                }
            });
    </script>

    <!-- Logout Modal -->
    <div class="modal fade" id="logoutModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Confirm Logout</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">Are you sure you want to logout?</div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" id="confirmLogoutBtn" class="btn btn-danger">Logout</button>
                </div>
            </div>
        </div>
    </div>

    <!-- ══════════════════════ MAIN ══════════════════════ -->
    <div class="admin-layout" style="margin-top: 5em;">
        <main class="main-content">

            <!-- Header -->
            <div class="content-header d-flex justify-content-between align-items-center mb-4">
                <h1 class="mb-0 fw-bold">Bookings Management</h1>
                <div class="search-container">
                    <div class="input-group">
                        <span class="input-group-text bg-white border-end-0">
                            <i class="bi bi-search text-muted"></i>
                        </span>
                        <input
                            type="text"
                            id="searchInput"
                            class="form-control border-start-0"
                            placeholder="Search name, email, destination…"
                        />
                    </div>
                </div>
            </div>

            <!-- Table Card -->
            <div class="card shadow-sm border-0">
                <div class="table-responsive">
                    <table class="table bookings-table styled-table table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>ID</th>
                                <th>Name</th>
                                <th>Email</th>
                                <th>Destination</th>
                                <th>Date</th>
                                <th>Status</th>
                                <th class="text-center">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="bookingsTable"></tbody>
                    </table>
                </div>

                <!-- Pagination -->
                <div id="pagination" class="d-flex justify-content-center p-3 flex-wrap gap-1"></div>
            </div>

        </main>
    </div>

    <!-- Booking Detail Modal (converted to Bootstrap modal) -->
    <div class="modal fade" id="bookingModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Booking Record</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="modallContent"></div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Bridge: if bookings.js calls the old openModal / closeModal globals, map them to Bootstrap
        window.closeModal = () => {
            const el = document.getElementById('bookingModal');
            bootstrap.Modal.getInstance(el)?.hide();
        };

        window.openModal = () => {
            new bootstrap.Modal(document.getElementById('bookingModal')).show();
        };
    </script>

    <script src="bookings.js"></script>
</body>
</html>
