<!DOCTYPE html>
<html lang="en">
<head>
    <script src="auth-guard.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Reviews</title>

    <link rel="stylesheet" href="./css/admin.css">
    <link rel="stylesheet" href="../assets/css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>

    <style>
        :root { --sidebar-width: 260px; }
        #sidebar { position: fixed; top: 0; left: 0; height: 100vh; width: var(--sidebar-width); z-index: 1040; transition: transform 0.3s ease; overflow-y: auto; }
        #sidebar.hidden { transform: translateX(-100%); }
        #sidebar-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 1030; }
        #sidebar-overlay.active { display: block; }

        .main-content { margin-left: var(--sidebar-width); padding: 40px; transition: margin-left 0.3s ease; min-height: 100vh; }
        .main-content.expanded { margin-left: 0; }
        .search-container { width: 100%; max-width: 380px; }

        /* Responsive Table Hiding */
        @media (max-width: 767.98px) {
            .reviews-table th:nth-child(2), .reviews-table td:nth-child(2),
            .reviews-table th:nth-child(4), .reviews-table td:nth-child(4) { display: none; }
        }

        @media (max-width: 991.98px) {
            #sidebar { transform: translateX(-100%); }
            #sidebar.visible { transform: translateX(0); }
            .main-content { margin-left: 0 !important; padding: 20px 16px; }
        }
    </style>
</head>

<body>
    <div id="sidebar-overlay"></div>
    <div id="nav-placeholder"></div>
    <div id="navbar-placeholder"></div>

    <div class="admin-layout" style="margin-top: 5em;">
        <main class="main-content">
            <div class="content-header d-flex justify-content-between align-items-center mb-4">
                <h1 class="mb-0 fw-bold">Review Management</h1>
                <div class="search-container">
                    <div class="input-group">
                        <span class="input-group-text bg-white border-end-0">
                            <i class="bi bi-search text-muted"></i>
                        </span>
                        <input type="text" id="searchInput" class="form-control border-start-0" placeholder="Search customer or review text...">
                    </div>
                </div>
            </div>

            <div class="card shadow-sm border-0">
                <div class="table-responsive">
                    <table class="table reviews-table styled-table table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>Customer</th>
                                <th>Destination</th>
                                <th>Rating</th>
                                <th>Comment</th>
                                <th>Status</th>
                                <th class="text-center">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="reviewsTableBody">
                            </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script>
        fetch('nav.html').then(r => r.text()).then(data => { document.getElementById('nav-placeholder').innerHTML = data; });
        fetch('adminNavbar.html').then(r => r.text()).then(data => {
            document.getElementById('navbar-placeholder').innerHTML = data;
            const toggleBtn = document.getElementById('menuToggle');
            const sidebar = document.getElementById('sidebar');
            const mainContent = document.querySelector('.main-content');
            const overlay = document.getElementById('sidebar-overlay');

            if (toggleBtn) {
                toggleBtn.addEventListener('click', () => {
                    if (window.innerWidth < 992) {
                        sidebar.classList.toggle('visible');
                        overlay.classList.toggle('active');
                    } else {
                        sidebar.classList.toggle('hidden');
                        mainContent.classList.toggle('expanded');
                    }
                });
                overlay.addEventListener('click', () => {
                    sidebar.classList.remove('visible');
                    overlay.classList.remove('active');
                });
            }
        });
    </script>

    <script src="manage-reviews.js"></script>
</body>
</html>
