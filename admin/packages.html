<!DOCTYPE html>
<html lang="en">
<head>
    <script src="auth-guard.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Packages</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
    <link rel="stylesheet" href="./css/admin.css">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>

    <style>
        :root {
            --sidebar-width: 260px;
        }

        body {
            background: #f4f6f9;
        }

        /* ── Sidebar ── */
          #sidebar {
            position: fixed;
            top: 0;
            left: 0;
            height: 100vh;
            width: var(--sidebar-width);
            z-index: 1040;
            transition: transform 0.3s ease;
            overflow-y: auto;
        }
        #sidebar.hidden {
            transform: translateX(-100%);
        }

        /* Mobile overlay */
        #sidebar-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.45);
            z-index: 1030;
        }

        #sidebar-overlay.active {
            display: block;
        }

        /* ── Main ── */
        .main {
            margin-left: var(--sidebar-width);
            padding: 40px;
            transition: margin-left 0.3s ease;
            min-height: 100vh;
        }

        .main.expanded {
            margin-left: 0;
        }

        /* ── Table: hide less-critical columns on small screens ── */
        @media (max-width: 767.98px) {
            /* Hide Duration on mobile */
            .packages-table th:nth-child(5),
            .packages-table td:nth-child(5) {
                display: none;
            }
        }

        @media (max-width: 575.98px) {
            /* Also hide ID on xs */
            .packages-table th:nth-child(1),
            .packages-table td:nth-child(1) {
                display: none;
            }
        }

        /* ── Responsive breakpoints ── */
        @media (max-width: 991.98px) {
            #sidebar {
                transform: translateX(-100%);
            }

            #sidebar.visible {
                transform: translateX(0);
            }

            .main {
                margin-left: 0 !important;
                padding: 20px 16px;
            }
        }

        @media (max-width: 575.98px) {
            .main {
                padding: 16px 12px;
            }

            h2 {
                font-size: 1.25rem;
            }

            .page-header {
                flex-direction: column;
                align-items: flex-start !important;
                gap: 10px;
            }
        }
    </style>
</head>

<body>

    <!-- Mobile sidebar overlay -->
    <div id="sidebar-overlay"></div>

    <div id="nav-placeholder"></div>
    <script>
        fetch('nav.html')
            .then(r => r.text())
            .then(data => document.getElementById('nav-placeholder').innerHTML = data);
    </script>

    <div id="navbar-placeholder"></div>
    <script>
        fetch('adminNavbar.html')
            .then(r => r.text())
            .then(data => {
                document.getElementById('navbar-placeholder').innerHTML = data;

                // Logout → modal
                const logoutBtn = document.getElementById('logoutBtn');
                if (logoutBtn) {
                    logoutBtn.addEventListener('click', () => {
                        new bootstrap.Modal(document.getElementById('logoutModal')).show();
                    });
                }

                // Sidebar toggle (responsive)
                const toggleBtn   = document.getElementById('menuToggle');
                const sidebar     = document.getElementById('sidebar');
                const mainContent = document.querySelector('.main');
                const overlay     = document.getElementById('sidebar-overlay');

                if (toggleBtn) {
                    toggleBtn.addEventListener('click', () => {
                        if (window.innerWidth < 992) {
                            sidebar.classList.toggle('visible');
                            overlay.classList.toggle('active');
                        } else {
                            sidebar.classList.toggle('hidden');
                            mainContent.classList.toggle('expanded');
                        }
                    });

                    overlay.addEventListener('click', () => {
                        sidebar.classList.remove('visible');
                        overlay.classList.remove('active');
                    });
                }

                // Actual logout
                const confirmBtn = document.getElementById('confirmLogoutBtn');
                if (confirmBtn) {
                    confirmBtn.addEventListener('click', () => {
                        localStorage.removeItem('adminToken');
                        window.location.href = 'login.html';
                    });
                }
            });
    </script>

    <!-- Logout Modal -->
    <div class="modal fade" id="logoutModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Confirm Logout</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">Are you sure you want to logout?</div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" id="confirmLogoutBtn" class="btn btn-danger">Logout</button>
                </div>
            </div>
        </div>
    </div>

    <!-- ══════════════════════ MAIN ══════════════════════ -->
    <div class="main" style="margin-top: 5em;">
<div class="page-header d-flex justify-content-between align-items-center mb-4">
    <h2 class="fw-bold mb-0">Manage Packages</h2>
    <button class="btn btn-warning rounded-pill px-4" onclick="openAddModal()">
        <i class="bi bi-plus-lg me-1"></i>
        <span>Add Package</span>
    </button>
</div>

        <!-- Table Card -->
        <div class="card shadow-sm border-0">
            <div class="table-responsive">
                <table class="table packages-table table-striped table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>ID</th>
                            <th>Title</th>
                            <th>Destination</th>
                            <th>Price</th>
                            <th>Duration</th>
                            <th class="text-center">Action</th>
                        </tr>
                    </thead>
                    <tbody id="packagesTable"></tbody>
                </table>
            </div>
        </div>

    </div>

    <!-- ══════════ Add / Edit Package Modal ══════════ -->
    <div class="modal fade" id="packageModal" tabindex="-1">
        <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
            <div class="modal-content">

                <div class="modal-header">
                    <h5 class="modal-title">Add New Package</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body">
                    <form id="packageForm">
                        <input type="hidden" id="packageId">

                        <div class="row g-3">

                            <div class="col-12 col-sm-6">
                                <label class="form-label fw-semibold">Package Title</label>
                                <input type="text" id="title" class="form-control" required>
                            </div>

                            <div class="col-12 col-sm-6">
                                <label class="form-label fw-semibold">Price (Ksh)</label>
                                <div class="input-group">
                                    <span class="input-group-text">Ksh</span>
                                    <input type="number" id="price" class="form-control" required min="0">
                                </div>
                            </div>

                            <div class="col-6 col-sm-3">
                                <label class="form-label fw-semibold">Days</label>
                                <input type="number" id="days" class="form-control" required min="1">
                            </div>

                            <div class="col-6 col-sm-3">
                                <label class="form-label fw-semibold">Nights</label>
                                <input type="number" id="nights" class="form-control" required min="0">
                            </div>

                            <div class="col-12 col-sm-6">
                                <label class="form-label fw-semibold">Destination</label>
                                <select id="destination" class="form-select" required>
                                    <option value="">-- Select Destination --</option>
                                </select>
                            </div>

                            <div class="col-12">
                                <label class="form-label fw-semibold">Package Image</label>
                                <input type="file" id="imageInput" class="form-control" accept="image/*">
                                <div class="mt-2">
                                    <img
                                        id="imagePreview"
                                        src=""
                                        alt="Image preview"
                                        class="rounded"
                                        style="width: 120px; height: 75px; object-fit: cover; display: none;"
                                    >
                                </div>
                            </div>

                            <div class="col-12">
                                <label class="form-label fw-semibold">Description</label>
                                <textarea id="description" class="form-control" rows="4"></textarea>
                            </div>

                        </div>
                    </form>
                </div>

                <div class="modal-footer">
                    <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button class="btn btn-warning px-4" onclick="savePackage()">
                        <i class="bi bi-floppy me-1"></i> Save Package
                    </button>
                </div>

            </div>
        </div>
    </div>

    <script>
        document.getElementById('imageInput').onchange = evt => {
            const [file] = evt.target.files;
            if (file) {
                const preview = document.getElementById('imagePreview');
                preview.src = URL.createObjectURL(file);
                preview.style.display = 'block';
            }
        };
    </script>

    <script src="packages.js"></script>
</body>
</html>
