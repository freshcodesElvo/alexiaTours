<!DOCTYPE html>
<html lang="en">
<head>
    <script src="auth-guard.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Hotel Bookings</title>

    <link rel="stylesheet" href="./css/admin.css">
    <link rel="stylesheet" href="../assets/css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>

    <style>
        :root {
            --sidebar-width: 260px;
        }

        body { background: #f4f6f9; }

        /* ── Sidebar ── */
        #sidebar {
            position: fixed;
            top: 0;
            left: 0;
            height: 100vh;
            width: var(--sidebar-width);
            z-index: 1040;
            transition: transform 0.3s ease;
            overflow-y: auto;
        }

        #sidebar.hidden { transform: translateX(-100%); }

        #sidebar-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.45);
            z-index: 1030;
        }

        #sidebar-overlay.active { display: block; }

        /* ── Main ── */
        .main-content {
            margin-left: var(--sidebar-width);
            padding: 40px;
            transition: margin-left 0.3s ease;
            min-height: 100vh;
        }

        .main-content.expanded { margin-left: 0; }

        /* ── Search ── */
        .search-container input { width: 100%; }

        /* ── Hide columns on small screens ── */
        @media (max-width: 767.98px) {
            /* Hide Dates and Room & Guests on mobile */
            .hotel-bookings-table th:nth-child(4),
            .hotel-bookings-table td:nth-child(4),
            .hotel-bookings-table th:nth-child(5),
            .hotel-bookings-table td:nth-child(5) {
                display: none;
            }
        }

        @media (max-width: 575.98px) {
            /* Also hide Date Received on xs */
            .hotel-bookings-table th:nth-child(1),
            .hotel-bookings-table td:nth-child(1) {
                display: none;
            }
        }

        /* ── Responsive breakpoints ── */
        @media (max-width: 991.98px) {
            #sidebar { transform: translateX(-100%); }
            #sidebar.visible { transform: translateX(0); }

            .main-content {
                margin-left: 0 !important;
                padding: 20px 16px;
            }
        }

        @media (max-width: 575.98px) {
            .main-content { padding: 16px 12px; }

            h1 { font-size: 1.25rem; }

            /* Stack header on xs */
            .content-header {
                flex-direction: column;
                align-items: flex-start !important;
                gap: 12px;
            }

            .content-header .d-flex {
                flex-direction: column;
                width: 100%;
                gap: 8px !important;
            }

            .search-container { width: 100%; }
        }
    </style>
</head>
<body>

    <!-- Mobile sidebar overlay -->
    <div id="sidebar-overlay"></div>

    <div id="nav-placeholder"></div>
    <script>
        fetch('nav.html')
            .then(r => r.text())
            .then(data => document.getElementById('nav-placeholder').innerHTML = data);
    </script>

    <div id="navbar-placeholder"></div>
    <script>
        fetch('adminNavbar.html')
            .then(r => r.text())
            .then(data => {
                document.getElementById('navbar-placeholder').innerHTML = data;

                // Logout → modal
                const logoutBtn = document.getElementById('logoutBtn');
                if (logoutBtn) {
                    logoutBtn.addEventListener('click', () => {
                        new bootstrap.Modal(document.getElementById('logoutModal')).show();
                    });
                }

                // Sidebar toggle (responsive)
                const toggleBtn   = document.getElementById('menuToggle');
                const sidebar     = document.getElementById('sidebar');
                const mainContent = document.querySelector('.main-content');
                const overlay     = document.getElementById('sidebar-overlay');

                if (toggleBtn) {
                    toggleBtn.addEventListener('click', () => {
                        if (window.innerWidth < 992) {
                            sidebar.classList.toggle('visible');
                            overlay.classList.toggle('active');
                        } else {
                            sidebar.classList.toggle('hidden');
                            mainContent.classList.toggle('expanded');
                        }
                    });

                    overlay.addEventListener('click', () => {
                        sidebar.classList.remove('visible');
                        overlay.classList.remove('active');
                    });
                }

                // Actual logout
                const confirmBtn = document.getElementById('confirmLogoutBtn');
                if (confirmBtn) {
                    confirmBtn.addEventListener('click', () => {
                        localStorage.removeItem('adminToken');
                        window.location.href = 'login.html';
                    });
                }
            });
    </script>

    <!-- Logout Modal -->
    <div class="modal fade" id="logoutModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Confirm Logout</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">Are you sure you want to logout?</div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" id="confirmLogoutBtn" class="btn btn-danger">Logout</button>
                </div>
            </div>
        </div>
    </div>

    <!-- ══════════════════════ MAIN ══════════════════════ -->
    <div class="admin-layout" style="margin-top: 5em;">
        <main class="main-content">
            <div class="container-fluid py-4">

                <!-- Page Header -->
                <div class="content-header d-flex justify-content-between align-items-center mb-4">
                    <h1 class="fw-bold mb-0">Hotel Bookings</h1>
                    <div class="d-flex align-items-center gap-2">
                        <button class="btn btn-success d-flex align-items-center gap-2 text-nowrap" onclick="exportToCSV()">
                            <i class="bi bi-file-earmark-spreadsheet"></i>
                            <span class="d-none d-sm-inline">Export CSV</span>
                        </button>
                        <div class="search-container">
                            <div class="input-group">
                                <span class="input-group-text bg-white border-end-0">
                                    <i class="bi bi-search text-muted"></i>
                                </span>
                                <input
                                    type="text"
                                    id="searchInput"
                                    class="form-control border-start-0"
                                    placeholder="Search…"
                                >
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Table Card -->
                <div class="card border-0 shadow-sm">
                    <div class="table-responsive">
                        <table class="table hotel-bookings-table table-hover align-middle mb-0">
                            <thead class="bg-dark text-white">
                                <tr>
                                    <th>Date Received</th>
                                    <th>Customer</th>
                                    <th>Hotel</th>
                                    <th>Dates (In/Out)</th>
                                    <th>Room &amp; Guests</th>
                                    <th class="text-center">Actions</th>
                                </tr>
                            </thead>
                            <tbody id="admin-bookings-table"></tbody>
                        </table>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <script src="./hotel-bookings.js"></script>
</body>
</html>
