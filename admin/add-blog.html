<!DOCTYPE html>
<html lang="en">
<head>
    <script src="auth-guard.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Journal Management</title>

    <link rel="stylesheet" href="./css/admin.css">
    <link rel="stylesheet" href="../assets/css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>

    <style>
        :root { --sidebar-width: 260px; }
        #sidebar { position: fixed; top: 0; left: 0; height: 100vh; width: var(--sidebar-width); z-index: 1040; transition: transform 0.3s ease; overflow-y: auto; }
        #sidebar.hidden { transform: translateX(-100%); }
        #sidebar-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 1030; }
        #sidebar-overlay.active { display: block; }

        .main-content { margin-left: var(--sidebar-width); padding: 40px; transition: margin-left 0.3s ease; min-height: 100vh; }
        .main-content.expanded { margin-left: 0; }
        .search-container { width: 100%; max-width: 380px; }

        .blog-thumb {
            width: 65px;
            height: 45px;
            object-fit: cover;
            border-radius: 4px;
            border: 1px solid #e0e0e0;
        }

        @media (max-width: 767.98px) {
            .blogs-table th:nth-child(2), .blogs-table td:nth-child(2),
            .blogs-table th:nth-child(4), .blogs-table td:nth-child(4) { display: none; }
        }

        @media (max-width: 991.98px) {
            #sidebar { transform: translateX(-100%); }
            #sidebar.visible { transform: translateX(0); }
            .main-content { margin-left: 0 !important; padding: 20px 16px; }
            .btn-create-txt { display: none; }
        }
    </style>
</head>

<body>
    <div id="sidebar-overlay"></div>
    <div id="nav-placeholder"></div>
    <div id="navbar-placeholder"></div>

    <div class="admin-layout" style="margin-top: 5em;">
        <main class="main-content">
            
            <div class="content-header d-flex flex-column flex-sm-row justify-content-between align-items-start align-items-sm-center gap-3 mb-4">
                <div>
                    <h1 class="mb-0 fw-bold">Journal Management</h1>
                    <p class="text-muted small mb-0">Publish, modify, or archive dynamic travel insights and safari articles.</p>
                </div>
                <div class="d-flex gap-2 w-100 w-sm-auto justify-content-end">
                    <div class="search-container flex-grow-1 flex-sm-grow-0">
                        <div class="input-group">
                            <span class="input-group-text bg-white border-end-0">
                                <i class="bi bi-search text-muted"></i>
                            </span>
                            <input type="text" id="searchInput" class="form-control border-start-0" placeholder="Search articles or slugs...">
                        </div>
                    </div>
                    <button type="button" class="btn text-white fw-semibold d-flex align-items-center gap-2 px-3" data-bs-toggle="modal" data-bs-target="#addBlogModal" style="background-color: #F99E1C; border-radius: 5px;">
                        <i class="bi bi-plus-circle-fill"></i> <span class="btn-create-txt">Write Article</span>
                    </button>
                </div>
            </div>

            <div class="card shadow-sm border-0" style="border-radius: 5px; overflow: hidden;">
                <div class="table-responsive">
                    <table class="table blogs-table styled-table table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th style="width: 80px;">Cover</th>
                                <th>Article Title</th>
                                <th>Category</th>
                                <th>Summary Snippet</th>
                                <th>Date Published</th>
                                <th class="text-center" style="width: 120px;">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="blogsTableBody">
                            <tr>
                                <td colspan="6" class="text-center py-5 text-muted">
                                    <div class="spinner-border text-secondary opacity-50 spinner-border-sm me-2" role="status"></div>
                                    Syncing operational journal records...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <div class="modal fade" id="addBlogModal" data-bs-backdrop="static" tabindex="-1" aria-labelledby="addBlogModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content border-0 shadow-lg" style="border-radius: 5px;">
                <div class="modal-header bg-light border-0 py-3">
                    <div class="d-flex align-items-center gap-2">
                        <i class="bi bi-pencil-square fs-4" style="color: #F99E1C;"></i>
                        <h5 class="modal-title fw-bold" id="addBlogModalLabel">Publish Journal Entry</h5>
                    </div>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                
                <form id="blog-creation-form" enctype="multipart/form-data">
                    <div class="modal-body p-4">
                        <div id="form-alert" class="alert d-none" style="border-radius: 5px;"></div>
                        
                        <div class="row g-3">
                            <div class="col-12">
                                <label class="form-label fw-bold text-secondary small text-uppercase">Article Title</label>
                                <input type="text" name="title" id="blog-title" class="form-control" placeholder="e.g., The Ultimate Guide to the Great Wildebeest Migration" style="border-radius: 5px;" required>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label fw-bold text-secondary small text-uppercase">Journal Category</label>
                                <select name="category" id="blog-category" class="form-select text-dark" style="border-radius: 5px;" required>
                                    <option value="Safari Tips">Safari Tips</option>
                                    <option value="Packing Guide">Packing Guide</option>
                                    <option value="Cultural Insights">Cultural Insights</option>
                                    <option value="Beach Relaxation">Beach Relaxation</option>
                                    <option value="General Travel">General Travel</option>
                                </select>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label fw-bold text-secondary small text-uppercase">Cover Image Banner</label>
                                <input type="file" name="blog_image" id="blog-image" class="form-control" accept="image/*" style="border-radius: 5px;" required>
                            </div>

                            <div class="col-12">
                                <label class="form-label fw-bold text-secondary small text-uppercase">SEO Summary Snippet</label>
                                <textarea name="summary" id="blog-summary" class="form-control" rows="2" maxlength="450" placeholder="A brief snippet that displays on the preview cards to hook the traveler..." style="border-radius: 5px;" required></textarea>
                                <div class="form-text text-end small text-muted" id="char-counter">0 / 450 characters</div>
                            </div>

                            <div class="col-12">
                                <label class="form-label fw-bold text-secondary small text-uppercase">Complete Narrative Body Content</label>
                                <textarea name="content" id="blog-content" class="form-control" rows="8" placeholder="Write your full story details here..." style="border-radius: 5px; line-height: 1.6;" required></textarea>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer border-0 bg-light py-3">
                        <button type="button" class="btn btn-secondary fw-semibold" data-bs-dismiss="modal" style="border-radius: 5px;">Cancel</button>
                        <button type="submit" id="submit-btn" class="btn fw-bold text-white px-4" style="background-color: #F99E1C; border-radius: 5px;">
                            <span id="btn-text">Publish Post Live</span>
                            <span id="btn-spinner" class="spinner-border spinner-border-sm d-none" role="status"></span>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div class="modal fade" id="editBlogModal" data-bs-backdrop="static" tabindex="-1" aria-labelledby="editBlogModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content border-0 shadow-lg" style="border-radius: 5px;">
                <div class="modal-header bg-light border-0 py-3">
                    <div class="d-flex align-items-center gap-2">
                        <i class="bi bi-pencil-square fs-4" style="color: #F99E1C;"></i>
                        <h5 class="modal-title fw-bold" id="editBlogModalLabel">Modify Journal Entry</h5>
                    </div>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                
                <form id="edit-blog-form">
                    <div class="modal-body p-4">
                        <input type="hidden" id="edit-blog-id">
                        
                        <div class="row g-3">
                            <div class="col-12">
                                <label class="form-label fw-bold text-secondary small text-uppercase">Article Title</label>
                                <input type="text" id="edit-blog-title" class="form-control" style="border-radius: 5px;" required>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label fw-bold text-secondary small text-uppercase">Journal Category</label>
                                <select id="edit-blog-category" class="form-select text-dark" style="border-radius: 5px;" required>
                                    <option value="Safari Tips">Safari Tips</option>
                                    <option value="Packing Guide">Packing Guide</option>
                                    <option value="Cultural Insights">Cultural Insights</option>
                                    <option value="Beach Relaxation">Beach Relaxation</option>
                                    <option value="General Travel">General Travel</option>
                                </select>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label fw-bold text-secondary small text-uppercase">Featured Image Link Reference</label>
                                <input type="text" id="edit-blog-image" class="form-control" placeholder="assets/img/blog/custom.jpg" style="border-radius: 5px;">
                            </div>

                            <div class="col-12">
                                <label class="form-label fw-bold text-secondary small text-uppercase">SEO Summary Snippet</label>
                                <textarea id="edit-blog-summary" class="form-control" rows="2" maxlength="450" style="border-radius: 5px;" required></textarea>
                            </div>

                            <div class="col-12">
                                <label class="form-label fw-bold text-secondary small text-uppercase">Complete Narrative Body Content</label>
                                <textarea id="edit-blog-content" class="form-control" rows="8" style="border-radius: 5px; line-height: 1.6;" required></textarea>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer border-0 bg-light py-3">
                        <button type="button" class="btn btn-secondary fw-semibold" data-bs-dismiss="modal" style="border-radius: 5px;">Cancel</button>
                        <button type="submit" class="btn fw-bold text-white px-4" style="background-color: #F99E1C; border-radius: 5px;">
                            Save Changes
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        fetch('nav.html').then(r => r.text()).then(data => { document.getElementById('nav-placeholder').innerHTML = data; });
        fetch('adminNavbar.html').then(r => r.text()).then(data => {
            document.getElementById('navbar-placeholder').innerHTML = data;
            const toggleBtn = document.getElementById('menuToggle');
            const sidebar = document.getElementById('sidebar');
            const mainContent = document.querySelector('.main-content');
            const overlay = document.getElementById('sidebar-overlay');

            if (toggleBtn) {
                toggleBtn.addEventListener('click', () => {
                    if (window.innerWidth < 992) {
                        sidebar.classList.toggle('visible');
                        overlay.classList.toggle('active');
                    } else {
                        sidebar.classList.toggle('hidden');
                        mainContent.classList.toggle('expanded');
                    }
                });
                overlay.addEventListener('click', () => {
                    sidebar.classList.remove('visible');
                    overlay.classList.remove('active');
                });
            }
        });
    </script>

    <script src="../userjs/config.js"></script>
    <script src="add-blog.js"></script>
</body>
</html>
