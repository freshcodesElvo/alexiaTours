  <!-- Floating Language Toggle -->
<div id="alexia-lang-wrapper">
    <div id="alexia-lang-btn" onclick="toggleLangMenu()">
        <span class="country-code">GB</span>
        <span class="lang-text">EN</span>
        <i class="ri-arrow-up-s-fill"></i>
    </div>

    <div id="alexia-lang-menu">
        <!-- English -->
        <div class="lang-item" onclick="changeLanguage('en', 'GB', 'EN')">
            <span class="code">GB</span> <span class="name">English</span>
        </div>
        <!-- German (NEW) -->
        <div class="lang-item" onclick="changeLanguage('de', 'DE', 'DE')">
            <span class="code">DE</span> <span class="name">Deutsch</span>
        </div>
        <!-- Swahili -->
        <div class="lang-item" onclick="changeLanguage('sw', 'KE', 'SW')">
            <span class="code">KE</span> <span class="name">Swahili</span>
        </div>
        <!-- Arabic -->
        <div class="lang-item" onclick="changeLanguage('ar', 'SA', 'AR')">
            <span class="code">SA</span> <span class="name">Arabic</span>
        </div>
        <!-- Chinese -->
        <div class="lang-item" onclick="changeLanguage('zh-CN', 'CN', 'ZH')">
            <span class="code">CN</span> <span class="name">Chinese (Simplified)</span>
        </div>
        <!-- Dutch -->
        <div class="lang-item" onclick="changeLanguage('nl', 'NL', 'NL')">
            <span class="code">NL</span> <span class="name">Dutch</span>
        </div>
    </div>

    <div id="google_translate_element" style="display:none;"></div>
</div>

<script type="text/javascript">
    function googleTranslateElementInit() {
        new google.translate.TranslateElement({
            pageLanguage: 'en',
            autoDisplay: false
        }, 'google_translate_element');
    }

    function toggleLangMenu() {
        document.getElementById('alexia-lang-menu').classList.toggle('show');
        const icon = document.querySelector('#alexia-lang-btn i');
        icon.style.transform = icon.style.transform === 'rotate(180deg)' ? 'rotate(0deg)' : 'rotate(180deg)';
    }

    function changeLanguage(langCode, country, display) {
        document.querySelector('#alexia-lang-btn .country-code').innerText = country;
        document.querySelector('#alexia-lang-btn .lang-text').innerText = display;

        var selectField = document.querySelector("#google_translate_element select");
        if(selectField) {
            selectField.value = langCode;
            selectField.dispatchEvent(new Event('change'));
        }
        
        toggleLangMenu();
    }

    window.onclick = function(event) {
        if (!event.target.closest('#alexia-lang-wrapper')) {
            document.getElementById('alexia-lang-menu').classList.remove('show');
            document.querySelector('#alexia-lang-btn i').style.transform = 'rotate(0deg)';
        }
    }
</script>

<script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

<style>
    #alexia-lang-wrapper {
        position: fixed;
        bottom: 30px;

        z-index: 999999;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;

    #alexia-lang-btn {
        background: white;
        padding: 10px 18px;
        border-radius: 8px;

        font-weight: 600;

    .lang-item {

</style>
