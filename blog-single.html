<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Travel Journal | Alexia's Tours</title>
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet"/>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body style="padding-top: 80px; background-color: #fdfdfd;">

  <div id="navbar-placeholder"></div>

  <article class="py-5">
    <div class="container" style="max-width: 850px;">
      
      <div class="mb-4">
        <a href="destinations.html" class="text-decoration-none fw-bold small d-inline-flex align-items-center gap-1" style="color: #F99E1C;">
          <i class="ri-arrow-left-line"></i> Back to Destinations
        </a>
      </div>

      <div id="article-loader" class="text-center py-5">
        <div class="spinner-border text-secondary opacity-50 mb-2" role="status" style="width: 2rem; height: 2rem;"></div>
        <p class="text-muted small text-uppercase tracking-wider">Unfolding narrative layers...</p>
      </div>

      <div id="article-content" class="d-none">
        
        <div class="d-flex align-items-center gap-3 mb-3">
          <span id="article-category" class="badge text-white fw-semibold px-3 py-2" style="background-color: #F99E1C; border-radius: 4px; font-size: 0.75rem;"></span>
          <span id="article-date" class="text-muted small"><i class="ri-calendar-todo-line me-1"></i></span>
        </div>

        <h1 id="article-title" class="display-5 fw-bold text-dark mb-4 lh-sm"></h1>

        <div class="shadow-sm mb-5 overflow-hidden" style="border-radius: 6px; height: 420px; width: 100%;">
          <img id="article-banner" src="" class="w-100 h-100" style="object-fit: cover;" alt="Cover Banner">
        </div>

        <div id="article-body" class="text-secondary lh-lg fs-5" style="white-space: pre-line; letter-spacing: -0.01em;">
          </div>

      </div>

    </div>
  </article>

  <div id="footer-placeholder"></div>

  <script src="userjs/config.js"></script>
  <script src="userjs/loader.js"></script> 
  <script src="userjs/blog-single.js"></script>
</body>
</html>
