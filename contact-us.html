<div id="navbar-placeholder"></div>
<script>
  fetch('navbar.html')
  .then(r => r.text())
  .then(data => {
    document.getElementById('navbar-placeholder').innerHTML = data;

    let currentPage = window.location.pathname;

    if (currentPage === "/" || currentPage === "") {
      currentPage = "index.html";
    } else {
      currentPage = currentPage.split("/").pop();
    }

    document.querySelectorAll(".navbar-nav .nav-link").forEach(link => {
      let linkPage = link.getAttribute("href");

      if (linkPage === "/" || linkPage === "") {
        linkPage = "index.html";
      }

      if (linkPage === currentPage) {
        link.classList.add("active");
      } else {
        link.classList.remove("active");
      }
    });
  });
</script>

<script type="text/javascript">
    function googleTranslateElementInit() {
        new google.translate.TranslateElement({
            pageLanguage: 'en',
            autoDisplay: false
        }, 'google_translate_element');
    }

    function toggleLangMenu() {
        document.getElementById('alexia-lang-menu').classList.toggle('show');
        const icon = document.querySelector('#alexia-lang-btn i');
        icon.style.transform = icon.style.transform === 'rotate(180deg)' ? 'rotate(0deg)' : 'rotate(180deg)';
    }

    function changeLanguage(langCode, country, display) {
        document.querySelector('#alexia-lang-btn .country-code').innerText = country;
        document.querySelector('#alexia-lang-btn .lang-text').innerText = display;

        var selectField = document.querySelector("#google_translate_element select");
        if(selectField) {
            selectField.value = langCode;
            selectField.dispatchEvent(new Event('change'));
        }
        
        toggleLangMenu();
    }

    window.onclick = function(event) {
        if (!event.target.closest('#alexia-lang-wrapper')) {
            document.getElementById('alexia-lang-menu').classList.remove('show');
            document.querySelector('#alexia-lang-btn i').style.transform = 'rotate(0deg)';
        }
    }
</script>

<div class="cursor-circle"></div>

<script>
const cursor = document.querySelector(".cursor-circle");
let mouseX = 0, mouseY = 0;
let currentX = 0, currentY = 0;

document.addEventListener("mousemove", (e) => {
  mouseX = e.clientX;
  mouseY = e.clientY;
});

function animate() {
  currentX += (mouseX - currentX) * 0.15;
  currentY += (mouseY - currentY) * 0.15;

  cursor.style.left = currentX + "px";
  cursor.style.top = currentY + "px";

  requestAnimationFrame(animate);
}

animate();
</script>
